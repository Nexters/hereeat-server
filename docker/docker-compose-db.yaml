services:
  yogieat-db:
    image: postgis/postgis:15-3.3
    container_name: yogieat-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: yogieat-db
      POSTGRES_USER: yogieat
      POSTGRES_PASSWORD: yogieat!@
      TZ: Asia/Seoul
    command: [ "postgres", "-c", "log_statement=all" ]
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
