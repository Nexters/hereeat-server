# Dev 1vCore, 1GB RAM, 50GB Storage
services:
  yogieat-api:
    cpus: "0.50"
    mem_limit: "320m"
    mem_reservation: "160m"
    environment:
      - DATASOURCE_DB_CORE_MAXIMUM_POOL_SIZE=5
      - DATASOURCE_DB_CORE_MINIMUM_IDLE=1
      - DATASOURCE_DB_CORE_CONNECTION_TIMEOUT=3000
      - API_TOMCAT_MAX_THREADS=220
      - API_TOMCAT_MIN_THREADS=25
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=65.0 -XX:MinRAMPercentage=30.0 -XX:MaxGCPauseMillis=500

  yogieat-admin:
    cpus: "0.25"
    mem_limit: "160m"
    mem_reservation: "80m"
    environment:
      - DATASOURCE_DB_CORE_MAXIMUM_POOL_SIZE=3
      - DATASOURCE_DB_CORE_MINIMUM_IDLE=1
      - DATASOURCE_DB_CORE_CONNECTION_TIMEOUT=3000
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:MinRAMPercentage=25.0 -XX:MaxGCPauseMillis=700

  yogieat-batch-sync:
    cpus: "0.10"
    mem_limit: "128m"
    mem_reservation: "48m"
    environment:
      - DATASOURCE_DB_CORE_MAXIMUM_POOL_SIZE=2
      - DATASOURCE_DB_CORE_MINIMUM_IDLE=1
      - DATASOURCE_DB_CORE_CONNECTION_TIMEOUT=3000
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=55.0 -XX:MinRAMPercentage=25.0 -XX:MaxGCPauseMillis=900

  yogieat-db:
    cpus: "0.15"
    mem_limit: "192m"
    mem_reservation: "96m"
    environment:
      - PG_LOG_STATEMENT=none
      - PG_SHARED_BUFFERS=64MB
      - PG_WORK_MEM=4MB
      - PG_MAINTENANCE_WORK_MEM=32MB
      - PG_MAX_CONNECTIONS=60
