services:
  yogieat-api:
    image: ${API_IMAGE_FULL_URL}
    container_name: ${DOCKERHUB_API_IMAGE_NAME}
    restart: always
    ports:
      - "${API_HOST_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Seoul
      - DATASOURCE_DB_CORE_JDBC_URL=${DATASOURCE_DB_CORE_JDBC_URL:-jdbc:postgresql://yogieat-db:5432/yogieat}
    networks:
      - yogieat-network
    env_file:
      - ${ENV_FILE_PATH:-~/.env}
    depends_on:
      - yogieat-db

  yogieat-admin:
    image: ${ADMIN_IMAGE_FULL_URL}
    container_name: ${DOCKERHUB_ADMIN_IMAGE_NAME}
    restart: always
    ports:
      - "${ADMIN_HOST_BIND_IP:-127.0.0.1}:${ADMIN_HOST_PORT:-8081}:8081"
    environment:
      - TZ=Asia/Seoul
      - DATASOURCE_DB_CORE_JDBC_URL=${DATASOURCE_DB_CORE_JDBC_URL:-jdbc:postgresql://yogieat-db:5432/yogieat}
      - SERVER_PORT=8081
    networks:
      - yogieat-network
    env_file:
      - ${ENV_FILE_PATH:-~/.env}
    depends_on:
      - yogieat-db

  yogieat-batch-sync:
    image: ${BATCH_IMAGE_FULL_URL}
    container_name: ${DOCKERHUB_BATCH_IMAGE_NAME}
    restart: always
    environment:
      - TZ=Asia/Seoul
      - DATASOURCE_DB_CORE_JDBC_URL=${DATASOURCE_DB_CORE_JDBC_URL:-jdbc:postgresql://yogieat-db:5432/yogieat}
      - SPRING_TASK_SCHEDULING_ENABLED=true
      - SERVER_PORT=${BATCH_SERVER_PORT:-9090}
    networks:
      - yogieat-network
    env_file:
      - ${ENV_FILE_PATH:-~/.env}
    depends_on:
      - yogieat-db

  yogieat-reservation-browser-worker:
    profiles:
      - reservation-browser-worker
    image: ${RESERVATION_BROWSER_WORKER_IMAGE_FULL_URL:-yogieat/yogieat-reservation-browser-worker:local}
    container_name: ${RESERVATION_BROWSER_WORKER_CONTAINER_NAME:-yogieat-reservation-browser-worker}
    restart: always
    environment:
      - TZ=Asia/Seoul
      - PORT=8090
      - BROWSER_WORKER_MAX_CONCURRENCY=${BROWSER_WORKER_MAX_CONCURRENCY:-1}
      - BROWSER_WORKER_REQUEST_TIMEOUT_MS=${BROWSER_WORKER_REQUEST_TIMEOUT_MS:-30000}
      - BROWSER_WORKER_NAVIGATION_TIMEOUT_MS=${BROWSER_WORKER_NAVIGATION_TIMEOUT_MS:-15000}
      - BROWSER_WORKER_MAX_QUERIES_PER_PROVIDER=${BROWSER_WORKER_MAX_QUERIES_PER_PROVIDER:-2}
      - BROWSER_WORKER_MIN_MATCH_SCORE=${BROWSER_WORKER_MIN_MATCH_SCORE:-0.6}
    networks:
      - yogieat-network
    env_file:
      - ${ENV_FILE_PATH:-~/.env}
    volumes:
      - reservation_browser_profile:/ms-playwright-profile
    shm_size: "256m"
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  yogieat-db:
    image: postgis/postgis:15-3.3
    container_name: yogieat-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: yogieat
      POSTGRES_USER: ${DATASOURCE_DB_CORE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_DB_CORE_PASSWORD}
      TZ: Asia/Seoul
    env_file:
      - ${ENV_FILE_PATH:-~/.env}
    command:
      - "postgres"
      - "-c"
      - "log_statement=${PG_LOG_STATEMENT:-none}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-64MB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-32MB}"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-60}"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATASOURCE_DB_CORE_USERNAME} -d yogieat" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yogieat-network
#  TODO: Redis, etc.

networks:
  yogieat-network:
    name: yogieat-network
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  reservation_browser_profile:
