spring:
  threads:
    virtual:
      enabled: true
  application:
    name: yogieat-admin
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import:
      - logging.yaml
      - datasource.yaml
      - client.yaml
      - ai.yaml

server:
  port: 8081
  tomcat:
    threads:
      max: ${ADMIN_TOMCAT_MAX_THREADS:32}
      min-spare: ${ADMIN_TOMCAT_MIN_THREADS:4}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters}
  access-token-validity: 3600000
  refresh-token-validity: 604800000

admin:
  warmup:
    enabled: ${ADMIN_WARMUP_ENABLED:true}

restaurant:
  collection:
    processor:
      enabled: ${RESTAURANT_COLLECTION_PROCESSOR_ENABLED:true}
  sync:
    service:
      enabled: false

kakao:
  client:
    enabled: ${KAKAO_CLIENT_ENABLED:true}
  api:
    api-key: ${KAKAO_API_KEY:admin-dummy-key}
    base-url: ${KAKAO_API_BASE_URL:https://dapi.kakao.com}
    client:
      enabled: ${kakao.client.enabled}
  admin:
    client:
      search-size: ${KAKAO_ADMIN_SEARCH_SIZE:5}
      max-retry-attempts: ${KAKAO_ADMIN_MAX_RETRY_ATTEMPTS:3}
      concurrent-permits: ${KAKAO_ADMIN_CONCURRENT_PERMITS:6}
      retry-base-delay-ms: ${KAKAO_ADMIN_RETRY_BASE_DELAY_MS:180}
      retry-jitter-rate: ${KAKAO_ADMIN_RETRY_JITTER_RATE:0.2}
      cache-ttl-ms: ${KAKAO_ADMIN_CACHE_TTL_MS:20000}

ai:
  gemini:
    api-key: ${AI_GEMINI_API_KEY:${GEMINI_API_KEY:admin-dummy-key}}
    model: ${AI_GEMINI_MODEL:${GEMINI_MODEL:gemini-3-flash-preview}}
