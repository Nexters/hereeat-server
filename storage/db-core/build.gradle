dependencies {
    implementation project(':apps:domain')

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

def generatedDir = "${buildDir}/generated/sources/annotationProcessor/java/main"

sourceSets {
    main.java.srcDirs += [generatedDir]
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(generatedDir))
}

clean {
    delete file(generatedDir)
}

// Spotless should ignore QueryDSL generated classes
spotless {
    java {
        targetExclude("**/generated/**", "**/build/generated/**")
    }
}
