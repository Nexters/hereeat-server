springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  use-fqn: true
  swagger-ui:
    enabled: true
    path: /swagger-ui
    disable-swagger-default-url: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    doc-expansion: none
    persist-authorization: true
    syntax-highlight:
      theme: agate
swagger:
  server-url: http://localhost:8080
  user: yogieat
  password: yogieat1234

---
spring:
  config:
    activate:
      on-profile: dev
swagger:
  server-url: ${SWAGGER_SERVER_URL:https://dev-api.yogieat.com}
  user: yogieat
  password: yogieat1234
---
spring:
  config:
    activate:
      on-profile: prod
swagger:
  server-url: ${SWAGGER_SERVER_URL:https://api.yogieat.com}
  user: ${SWAGGER_USER}
  password: ${SWAGGER_PASSWORD}
---
