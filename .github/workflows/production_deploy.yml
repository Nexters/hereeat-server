name: production Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true

env:
  DOCKERHUB_USERNAME: yogieat
  DOCKERHUB_IMAGE_NAME: yogieat-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      # EC2로 배포
      - name: Deploy to Instance Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin
            echo "Deploying with IMAGE_FULL_URL=${{ steps.metadata.outputs.tags }}"
            cd ~
            IMAGE_FULL_URL="${{ steps.metadata.outputs.tags }}" DOCKERHUB_IMAGE_NAME="${{ env.DOCKERHUB_IMAGE_NAME }}" docker compose -f docker-compose.yaml up -d
            docker image prune -a -f

      - name: Discord notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🚀 PROD 빌드 및 수동 배포"
          description: |
            **상태**: ${{ job.status }}
            **브랜치**: ${{ github.ref_name }}
            **커밋**: ${{ github.sha }}
            **커밋 메시지**: ${{ github.event.head_commit.message }}
            **이미지**: ${{ steps.metadata.outputs.tags }}
          color: ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}
          username: GitHub Actions
