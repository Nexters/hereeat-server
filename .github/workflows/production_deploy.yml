name: production Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true

env:
  DOCKERHUB_USERNAME: yogieat
  DOCKERHUB_API_IMAGE_NAME: yogieat-server-api
  DOCKERHUB_BATCH_IMAGE_NAME: yogieat-server-batch-sync

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      # EC2로 배포
      - name: Deploy to Instance Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin
            API_IMAGE="${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_API_IMAGE_NAME }}:${{ github.event.inputs.version }}"
            BATCH_IMAGE="${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_BATCH_IMAGE_NAME }}:${{ github.event.inputs.version }}"
            echo "Deploying API image: ${API_IMAGE}"
            echo "Deploying Batch image: ${BATCH_IMAGE}"
            cd ~/docker
            API_IMAGE_FULL_URL="${API_IMAGE}" \
            BATCH_IMAGE_FULL_URL="${BATCH_IMAGE}" \
            DOCKERHUB_API_IMAGE_NAME="${{ env.DOCKERHUB_API_IMAGE_NAME }}" \
            DOCKERHUB_BATCH_IMAGE_NAME="${{ env.DOCKERHUB_BATCH_IMAGE_NAME }}" \
            ENABLE_EDGE_SSL="${{ secrets.ENABLE_EDGE_SSL }}" \
            EDGE_DOMAIN="${{ secrets.EDGE_DOMAIN }}" \
            ../scripts/deploy/compose-up.sh
            docker image prune -a -f

      - name: Discord notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🚀 PROD 빌드 및 수동 배포"
          description: |
            **상태**: ${{ job.status }}
            **브랜치**: ${{ github.ref_name }}
            **커밋**: ${{ github.sha }}
            **커밋 메시지**: ${{ github.event.head_commit.message }}
            **버전**: ${{ github.event.inputs.version }}
            **API 이미지**: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_API_IMAGE_NAME }}:${{ github.event.inputs.version }}
            **BATCH 이미지**: ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_BATCH_IMAGE_NAME }}:${{ github.event.inputs.version }}
          color: ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}
          username: GitHub Actions
